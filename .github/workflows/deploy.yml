name: Build & Deploy to LWS (SFTP password)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Build your site -> outputs to ./main/dist
      - name: Build
        working-directory: ./main
        run: |
          npm ci
          npm run build
          # probe file to verify on the web
          echo "deployed $(date -u)" > ./dist/deployed.txt

      # SFTP upload (password-based)
      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}          # e.g. webdb124.lwspanel.com
          port: 22
          username: ${{ secrets.SFTP_USER }}        # e.g. flyin1815335
          password: ${{ secrets.SFTP_PASSWORD }}    # your LWS FTP/SFTP password
          local_path: ./main/dist/
          remote_path: /htdocs/
          args: "-rz"                                # rsync-like flags

      # Debug: list /htdocs via SFTP to confirm files landed
      - name: List remote /htdocs (debug)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" \
            sftp -P 22 -o StrictHostKeyChecking=no "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" << 'EOF'
            ls -la /htdocs/
            EOF
