name: Deploy via FTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # If you have a build step, uncomment and adapt:
      # - name: Build site
      #   run: |
      #     npm ci
      #     npm run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # If you build, set this to ./dist or ./build
          local-dir: ./
          # ⚠️ Adjust this after confirming your docroot in hosting panel
          server-dir: /public_html/
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.DS_Store

      # Quick remote listing to confirm where files actually landed
      - name: List remote directory (debug)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp
          lftp -e "
            set ssl:verify-certificate no;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            pwd;
            ls -la /public_html/;
            bye
          "
