name: Deploy via FTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # If your dist is already committed, leave this commented.
      # If you need to build (React/Vite/etc.), uncomment and adapt:
      # - name: Build site
      #   working-directory: ./main
      #   run: |
      #     npm ci
      #     npm run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./main/dist/          # <<--- your built site
          server-dir: /public_html/         # adjust if your host uses a different docroot
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.DS_Store
          # optional safety if you don't want the action to wipe files outside this upload:
          # dangerous-clean-slate: false
