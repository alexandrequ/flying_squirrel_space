name: Build & Deploy to LWS (FTPS via lftp)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: ./main
        run: |
          npm ci
          npm run build
          echo "deployed $(date -u)" > ./dist/deployed.txt

      - name: Install lftp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

      # Upload dist -> /htdocs using explicit FTPS (TLS on port 21)
      - name: Mirror to /htdocs (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}       # e.g. ftp.flying-squirrel.space  (try this first)
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}   # e.g. flyin1815335
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}   # your LWS password
        run: |
          lftp -e "
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            mkdir -p /htdocs;
            mirror -Rev --parallel=2 --exclude-glob .git* --exclude-glob .github --exclude-glob node_modules ./main/dist /htdocs;
            bye
          "

      # Debug: list remote dir so you SEE the files
      - name: List /htdocs (debug)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:passive-mode true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            ls -la /htdocs/;
            bye
          "
